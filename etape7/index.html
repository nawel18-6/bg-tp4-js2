<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    
    <title>Document</title>
  </head>

  <body>
    
    <div id="table_container">

       <div id="form_container">
         <div class="form_group">
          <label class="form_label">Nom:</label>
            <input type="text" id="form_nom"  class="form_field"/>
          </div>


          <div class="form_group">
            <label for="form_prenom">Prenom:</label>
            <input type="text" id="form_prenom" class="form_field"/>
          </div>

          <div class="form_group">
            <label for="form_points">Points:</label>
            <input type="number" id="form_points" class="form_field"/>
            
            <button class="btn-add" onclick="doNewData()">Ajouter</button>
          </div>
     </div>

      <table id ="table">
        <thead>
          <tr>
            <th class="col_number">N</th>
            <th class="col_text">Nom</th>
            <th class="col_text">Prenom</th>
            <th class="col_number">Points</th>
            <th class="col_chkbox">Select</th>
          </tr>
        </thead>
        <tbody>
         
        </tbody>
      </table>

      <div id="container_summary">
        <p id="p1">lignes(s)= 0</p>
        <p id="p2"></p>
        <p id ="p3">Total Points= 0</p>
      </div>

      <div id="container_btn">
      <button class="btn-consol" onclick="consoleTableau()">ConsoleTableau</button>
      <button class="btn-del" onclick="deleteRow()">Supprimer</button>
      </div>
      
    </div>


<script src="script.js"></script>
</body>

</html>
